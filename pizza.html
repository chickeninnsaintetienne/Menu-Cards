<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizza Inn - Menu Pizzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #f36b18;
  --cream: #fff5e8;
  --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #080808; overflow: hidden; }

#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform-origin: center center; overflow: hidden; isolation: isolate;
  font-family: var(--body); color: #fff;
  background:
    radial-gradient(ellipse at 79% 22%, rgba(243,107,24,.26), transparent 34%),
    radial-gradient(ellipse at 14% 80%, rgba(200,75,11,.18), transparent 42%),
    linear-gradient(124deg, #0c0b0a 0%, #1a1512 48%, #080808 100%);
  box-shadow: 0 28px 90px rgba(0,0,0,.55);
}
/* frame */
#stage::before {
  content: ""; position: absolute; inset: 22px; z-index: 7; pointer-events: none;
  border: 3px solid rgba(255,245,232,.55);
  outline: 2px solid rgba(243,107,24,.9); outline-offset: -12px;
  box-shadow: 0 0 24px rgba(243,107,24,.35), inset 0 0 24px rgba(243,107,24,.2);
}

/* smoke */
.smoke { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
#smokeBack { z-index: 1; opacity: .85; }
#smokeFront { z-index: 6; opacity: .35; }

/* header */
.logo {
  position: absolute; left: 70px; top: 35px; width: 92px; height: 92px; z-index: 5;
  border-radius: 50%; background: #fff8ef; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 5px rgba(243,107,24,.88), 0 12px 28px rgba(0,0,0,.42);
}
.logo img { width: 70px; height: 70px; object-fit: contain; }
.brand-name {
  position: absolute; left: 190px; top: 48px; z-index: 5;
  font-family: var(--display); font-size: 62px; line-height: 1; letter-spacing: 2.5px;
  color: var(--cream); text-transform: uppercase; text-shadow: 3px 4px 0 #7c2d12, 0 0 24px rgba(243,107,24,.24);
}
.brand-name::after {
  content: "FRESH \2022  HOT \2022  DELICIOUS"; display: block; margin-top: 8px;
  font: 800 16px/1 var(--body); letter-spacing: 5px; color: #f8a36b; text-shadow: none;
}
.halal-logo {
  position: absolute; right: 78px; top: 34px; z-index: 5; width: 92px; height: 92px;
  border: 3px solid #fff1df; border-radius: 50%; color: var(--cream); text-align: center;
  background: radial-gradient(circle at 32% 25%, #ff9b45 0%, #f36b18 42%, #a83408 100%);
  box-shadow: 0 0 0 4px rgba(243,107,24,.38), 0 10px 28px rgba(0,0,0,.45);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.halal-logo .arabic { font-family: serif; font-size: 26px; line-height: 1.05; font-weight: 700; }
.halal-logo .halal-word { font-family: Arial, sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2.5px; line-height: 1.1; }

/* title (moved down for a clear gap under the logo) */
.title {
  position: absolute; margin: 0; left: 70px; top: 178px; z-index: 2; display: flex; white-space: pre;
  font-family: var(--display); font-size: 180px; line-height: .88; letter-spacing: -2px;
  color: #fff8ef; text-shadow: 8px 10px 0 rgba(124,45,18,.92), 0 0 42px rgba(243,107,24,.12);
  -webkit-text-stroke: 1px rgba(255,255,255,.14);
}
.title span { display: inline-block; opacity: 0; animation: smokeIn 1.5s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes smokeIn {
  from { opacity: 0; filter: blur(46px); transform: translateY(70px) scale(1.18); }
  60% { opacity: .9; }
  to { opacity: 1; filter: blur(0); transform: none; }
}

/* offer banner */
.offer {
  position: absolute; left: 720px; right: 78px; top: 180px; height: 140px; z-index: 4; border-radius: 22px;
  display: flex; align-items: center; gap: 26px; padding: 0 28px 0 170px;
  background: linear-gradient(145deg, #ff9b45, #e6530c 75%); border: 3px solid var(--cream);
  box-shadow: 0 8px 0 #7c2d12, 0 16px 28px rgba(0,0,0,.35);
  opacity: 0; animation: up .9s cubic-bezier(.2,.7,.2,1) 1.2s forwards;
}
.offer-pizza {
  position: absolute; left: -60px; top: 50%; width: 200px; height: 200px; object-fit: contain;
  transform: translateY(-50%) rotate(-8deg);
  filter: drop-shadow(0 14px 18px rgba(0,0,0,.5));
  animation: pizzaFloat 4s ease-in-out infinite;
}
@keyframes pizzaFloat {
  0%, 100% { transform: translateY(-50%) rotate(-8deg); }
  50%      { transform: translateY(-54%) rotate(-4deg); }
}
.offer .big { font-family: var(--display); font-size: 58px; line-height: .95; color: #fffaf3; text-shadow: 3px 4px 0 rgba(97,34,15,.9); flex: none; }
.offer .txt { flex: 1; min-width: 0; }
.offer .small { font: 800 22px/1.1 var(--body); letter-spacing: 4px; color: #fff5e8; }
.offer .gift { margin-top: 6px; font-family: var(--display); font-size: 42px; line-height: 1; color: #fff; text-shadow: 2px 3px 0 rgba(97,34,15,.9); }
.offer .free {
  flex: none; padding: 12px 22px; border-radius: 14px; transform: rotate(-4deg);
  font-family: var(--display); font-size: 44px; line-height: 1; letter-spacing: 2px;
  background: var(--cream); color: #d94e0b; box-shadow: 0 5px 0 #7c2d12;
}

/* pizza grid */
.items {
  position: absolute; left: 62px; right: 62px; top: 352px; height: 692px; z-index: 4;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px 14px;
}
.col {
  min-width: 0; padding: 10px 14px 10px 18px; border-radius: 20px; display: flex; align-items: center; gap: 12px;
  background: linear-gradient(155deg, rgba(255,255,255,.085), rgba(255,255,255,.02));
  border: 1px solid rgba(255,245,232,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 10px 22px rgba(0,0,0,.22);
  backdrop-filter: blur(5px);
  opacity: 0; filter: blur(16px); transform: translateY(40px);
  animation: up .8s cubic-bezier(.2,.7,.2,1) forwards;
}
.col:nth-child(even) { background: linear-gradient(155deg, rgba(243,107,24,.14), rgba(255,255,255,.02)); }
@keyframes up { to { opacity: 1; filter: blur(0); transform: none; } }
.info { flex: 1; min-width: 0; }
.nm {
  font-family: var(--display); font-size: 40px; line-height: 1.02; letter-spacing: .5px; text-transform: uppercase; color: #fff;
  text-shadow: 3px 4px 0 rgba(97,34,15,.95), 0 0 18px rgba(0,0,0,.4);
}
.ing { margin-top: 6px; font: 600 21px/1.2 var(--body); color: #ffd2ad; }
.price {
  flex: none; width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: rotate(7deg);
  font-family: var(--display); font-size: 36px; line-height: 1; color: #fffaf3; white-space: nowrap;
  background: linear-gradient(145deg, #ff9b45, #e6530c 75%); border: 3px solid var(--cream);
  box-shadow: 0 5px 0 #7c2d12, 0 10px 16px rgba(0,0,0,.34);
}

@media (prefers-reduced-motion: reduce) {
  .smoke { display: none; }
  .col, .offer, .title span { animation: none !important; opacity: 1 !important; filter: none !important; transform: none; }
  .offer-pizza { animation: none !important; }
}
</style>
</head>
<body>
<main id="stage" aria-label="Menu Pizzas">
  <canvas id="smokeBack" class="smoke" width="1920" height="1080"></canvas>
  <div class="logo"><img src="images/logo.png" alt="Logo"></div>
  <div class="brand-name">Pizza Inn</div>
  <div class="halal-logo" aria-label="Halal" title="Halal"><span class="arabic" lang="ar" dir="rtl">حلال</span><span class="halal-word">HALAL</span></div>
  <h1 class="title" id="title" aria-label="PIZZAS"></h1>
  <div class="offer">
    <img class="offer-pizza" src="images/pizza.png" alt="Pizza">
    <div class="big">SUPER PIZZA<br>OFFRE</div>
    <div class="txt">
      <div class="small">POUR L'ACHAT DE 3 PIZZAS</div>
      <div class="gift">1 BOUTEILLE DE COCA COLA 1,5L</div>
    </div>
    <div class="free">GRATUITE</div>
  </div>
  <section class="items" id="items"></section>
  <canvas id="smokeFront" class="smoke" width="1920" height="1080"></canvas>
</main>

<script>
// ---- EDIT YOUR MENU HERE ----
const euro = n => n.toFixed(2).replace('.', ',') + ' \u20AC';
const TITLE = 'PIZZAS';
const ITEMS = [
  { name: 'Italiana',      ing: 'Tomates, mozzarella, tomate fra\u00EEche, basilic', price: 8.00 },
  { name: 'Margarita',     ing: 'Tomates, mozzarella', price: 7.50 },
  { name: 'Tandoori',      ing: 'Tomates, mozzarella, poulet tandoori, oignons, olives', price: 10.00 },
  { name: 'Bois\u00E9e',   ing: 'Cr\u00E8me fra\u00EEche, poulet, poivrons, oignons, sauce gruy\u00E8re', price: 10.00 },
  { name: 'Thon',          ing: 'Tomates, mozzarella, thon, oignons, olives', price: 10.00 },
  { name: 'V\u00E9g\u00E9tarienne', ing: 'Tomates, mozzarella, courgettes, aubergines, poivrons', price: 8.50 },
  { name: 'Reine',         ing: 'Tomates, mozzarella, jambon, champignons', price: 9.50 },
  { name: 'Orientale',     ing: 'Tomates, mozzarella, merguez, poivrons, oignons', price: 10.00 },
  { name: '4 Fromages',    ing: 'Tomates, 4 fromages', price: 9.50 },
  { name: 'Napolitaine',   ing: 'Tomates, mozzarella, anchois, c\u00E2pres, olives', price: 9.50 },
  { name: '4 Saisons',     ing: 'Tomates, mozzarella, jambon, champignons, artichauts, olives', price: 10.00 },
  { name: 'Bismark',       ing: 'Tomates, mozzarella, jambon, \u0153uf', price: 9.50 },
  { name: 'Am\u00E9ricaine', ing: 'Tomates, mozzarella, saucisse, frites', price: 10.00 },
  { name: 'Diavola',       ing: 'Tomates, mozzarella, salami piquant, olives', price: 9.50 },
  { name: 'Parmigiana',    ing: 'Tomates, mozzarella, aubergines, parmesan', price: 9.50 },
  { name: 'Calzone',       ing: 'Tomates, mozzarella, jambon', price: 8.50 }
];
// -----------------------------

const title = document.getElementById('title');
[...TITLE].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? '\u00A0' : ch;
  s.style.animationDelay = (0.15 + i * 0.14) + 's';
  title.appendChild(s);
});

const items = document.getElementById('items');
ITEMS.forEach((it, i) => {
  const c = document.createElement('div');
  c.className = 'col';
  c.style.animationDelay = (0.6 + i * 0.06) + 's';
  c.innerHTML =
    '<div class="info"><div class="nm">' + it.name + '</div><div class="ing">' + it.ing + '</div></div>' +
    '<div class="price">' + euro(it.price) + '</div>';
  items.appendChild(c);
});

function fitTitle() {
  title.style.fontSize = '180px';
  const max = 620, w = title.scrollWidth;
  if (w > max) title.style.fontSize = Math.floor(180 * max / w) + 'px';
}
fitTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

// ---- smoke ----
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7), LIFE = [8, 8, 4];
const mk = (n, f) => Array.from({ length: n }, (_, i) => f(i));
const backSmoke = mk(46, i => ({ x: R()*2100-100, y: 1200+R()*100, rise: 900+R()*500, r0: 140+R()*120, r1: 200+R()*200, amp: 50+R()*110, fr: 1+Math.floor(R()*2), ph: R()*6.28, dr: -200+R()*400, off: R()*8, L: LIFE[i%3], a: .26+R()*.16, c: i%4===0 ? '124,45,18' : '255,255,255' }));
const wisps = mk(14, i => ({ x: R()*2000, y: 1150, rise: 1000+R()*300, r0: 260+R()*120, r1: 260+R()*150, amp: 120+R()*120, fr: 1, ph: R()*6.28, dr: -300+R()*600, off: R()*8, L: 8, a: .16+R()*.08, c: '255,255,255' }));

function drawSmoke(ctx, arr, t) {
  ctx.clearRect(0, 0, 1920, 1080);
  for (const p of arr) {
    const u = ((t / 1000 + p.off) % p.L) / p.L;
    const x = p.x + Math.sin(u * 6.283 * p.fr + p.ph) * p.amp + u * p.dr;
    const y = p.y - u * p.rise, r = p.r0 + u * p.r1;
    const al = p.a * Math.pow(Math.sin(Math.PI * u), 1.4);
    if (al < .004) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + p.c + ',' + al + ')');
    g.addColorStop(.55, 'rgba(' + p.c + ',' + (al * .45) + ')');
    g.addColorStop(1, 'rgba(' + p.c + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
}
const bctx = document.getElementById('smokeBack').getContext('2d');
const fctx = document.getElementById('smokeFront').getContext('2d');
function setTime(t) { drawSmoke(bctx, backSmoke, t); drawSmoke(fctx, wisps, t); }
if (matchMedia('(prefers-reduced-motion: reduce)').matches) setTime(3000);
else { const t0 = performance.now(); (function loop(n) { setTime(n - t0); requestAnimationFrame(loop); })(t0); }

// ---- fit 1920x1080 stage to any screen ----
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + k + ')';
}
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
