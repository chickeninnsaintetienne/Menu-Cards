<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chicken Inn - Menus Famille Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #f36b18;
  --orange-dark: #c84b0b;
  --brown: #61220f;
  --cream: #fff5e8;
  --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #080808; overflow: hidden; }

#stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform-origin: center center; overflow: hidden; isolation: isolate;
  font-family: var(--body); color: #fff;
  background:
    radial-gradient(ellipse at 79% 22%, rgba(243,107,24,.26), transparent 34%),
    radial-gradient(ellipse at 14% 80%, rgba(200,75,11,.18), transparent 42%),
    linear-gradient(124deg, #0c0b0a 0%, #1a1512 48%, #080808 100%);
  box-shadow: 0 28px 90px rgba(0,0,0,.55);
}
#stage::before {
  content: ""; position: absolute; inset: 22px; z-index: 7; pointer-events: none;
  border: 3px solid rgba(255,245,232,.55);
  outline: 2px solid rgba(243,107,24,.9); outline-offset: -12px;
  box-shadow: 0 0 24px rgba(243,107,24,.35), inset 0 0 24px rgba(243,107,24,.2);
}
#stage::after {
  content: ""; position: absolute; left: 0; right: 0; top: 392px; height: 2px; z-index: 2;
  background: linear-gradient(90deg, transparent, rgba(243,107,24,.9) 12%, rgba(255,245,232,.28) 50%, rgba(243,107,24,.9) 88%, transparent);
  box-shadow: 0 0 22px rgba(243,107,24,.25);
}

/* smoke canvases */
.smoke { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
#smokeBack { z-index: 1; opacity: .85; }
#smokeFront { z-index: 6; opacity: .45; }

/* header */
.logo {
  position: absolute; left: 70px; top: 35px; width: 92px; height: 92px; z-index: 5;
  border-radius: 50%; background: #fff8ef; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 0 5px rgba(243,107,24,.88), 0 12px 28px rgba(0,0,0,.42);
}
.logo img { width: 70px; height: 70px; object-fit: contain; }
.brand-name {
  position: absolute; left: 190px; top: 48px; z-index: 5;
  font-family: var(--display); font-size: 62px; line-height: 1; letter-spacing: 2.5px;
  color: var(--cream); text-transform: uppercase;
  text-shadow: 3px 4px 0 #7c2d12, 0 0 24px rgba(243,107,24,.24);
}
.brand-name::after {
  content: "FRESH \2022  CRISPY \2022  DELICIOUS"; display: block; margin-top: 8px;
  font: 800 16px/1 var(--body); letter-spacing: 5px; color: #f8a36b; text-shadow: none;
}
.halal-logo {
  position: absolute; right: 78px; top: 34px; z-index: 5; width: 92px; height: 92px;
  border: 3px solid #fff1df; border-radius: 50%; color: var(--cream); text-align: center;
  background: radial-gradient(circle at 32% 25%, #ff9b45 0%, #f36b18 42%, #a83408 100%);
  box-shadow: 0 0 0 4px rgba(243,107,24,.38), 0 10px 28px rgba(0,0,0,.45);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.halal-logo .arabic { font-family: serif; font-size: 26px; line-height: 1.05; font-weight: 700; }
.halal-logo .halal-word { font-family: Arial, sans-serif; font-size: 13px; font-weight: 900; letter-spacing: 2.5px; line-height: 1.1; }

/* title */
.title {
  position: absolute; margin: 0; left: 70px; top: 150px; z-index: 2; display: flex; white-space: pre;
  font-family: var(--display); font-size: 250px; line-height: .88; letter-spacing: -3px;
  color: #fff8ef; text-shadow: 8px 10px 0 rgba(124,45,18,.92), 0 0 42px rgba(243,107,24,.12);
  -webkit-text-stroke: 1px rgba(255,255,255,.14);
}
.title span { display: inline-block; opacity: 0; animation: smokeIn 1.5s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes smokeIn {
  from { opacity: 0; filter: blur(46px); transform: translateY(70px) scale(1.18); }
  60% { opacity: .9; }
  to { opacity: 1; filter: blur(0); transform: none; }
}

/* items: 5 family menu cards */
.items { position: absolute; left: 62px; right: 62px; top: 412px; height: 620px; display: flex; gap: 12px; z-index: 4; }
.col {
  flex: 1; min-width: 0; padding: 12px 8px 14px; border-radius: 22px; display: flex; flex-direction: column;
  background: linear-gradient(155deg, rgba(255,255,255,.075), rgba(255,255,255,.018));
  border: 1px solid rgba(255,245,232,.14);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 12px 28px rgba(0,0,0,.22);
  backdrop-filter: blur(5px);
  opacity: 0; filter: blur(20px); transform: translateY(50px);
  animation: up .85s cubic-bezier(.2,.7,.2,1) forwards;
}
.col:nth-child(2n) { background: linear-gradient(155deg, rgba(243,107,24,.13), rgba(255,255,255,.018)); }
@keyframes up { to { opacity: 1; filter: blur(0); transform: none; } }
.pbox {
  position: relative; flex: 1; min-height: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 50% 65%, rgba(243,107,24,.15), transparent 68%);
}
.pbox img { position: absolute; z-index: 1; left: 50%; top: 50%; width: 112%; height: 100%; max-width: none; object-fit: contain; transform: translate(-50%, -50%) rotate(-3deg); filter: drop-shadow(0 16px 11px rgba(0,0,0,.52)); }
.col:nth-child(2n) .pbox img { transform: translate(-50%, -50%) rotate(3deg); }
.num {
  position: absolute; left: 6px; top: 0; width: 88px; height: 88px; border-radius: 50%; z-index: 3;
  display: flex; align-items: center; justify-content: center; transform: rotate(-6deg);
  background: linear-gradient(145deg, #ff9b45, #e6530c 75%); color: #fffaf3; border: 3px solid var(--cream); box-shadow: 0 5px 0 #7c2d12, 0 10px 16px rgba(0,0,0,.34);
}
.num .nb { font-family: var(--display); font-size: 48px; line-height: 1; }
.nm {
  flex: none; margin: 12px 0; padding: 0 4px;
  display: flex; flex-direction: column; justify-content: flex-end;
  font-family: var(--display); font-size: 34px; line-height: 1.08; letter-spacing: .5px; color: #fff;
  text-shadow: 3px 4px 0 rgba(97,34,15,.95), 0 0 18px rgba(0,0,0,.45);
}
.nm small { display: block; margin: 4px 0; font: 800 20px/1 var(--body); letter-spacing: 4px; color: #ff9b45; text-shadow: none; }
.pricebar {
  flex: none; height: 100px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 10px; white-space: nowrap;
  background: linear-gradient(145deg, #ff9b45, #e6530c 75%); box-shadow: 0 6px 0 #7c2d12, 0 12px 18px rgba(0,0,0,.3);
}
.pricebar .lb { font: 800 18px/1 var(--body); letter-spacing: 5px; margin-bottom: 4px; color: #fffaf3; }
.pricebar .pr { font-family: var(--display); font-size: 50px; line-height: 1; color: #fffaf3; }

@media (prefers-reduced-motion: reduce) {
  .smoke { display: none; }
  .col, .title span { animation: none !important; opacity: 1 !important; filter: none !important; transform: none; }
}
</style>
</head>
<body>
<main id="stage" aria-label="Menu Menus Famille">
  <canvas id="smokeBack" class="smoke" width="1920" height="1080"></canvas>
  <div class="logo"><img src="images/logo.png" alt="Logo"></div>
  <div class="brand-name">Chicken Inn</div>
  <div class="halal-logo" aria-label="Halal" title="Halal"><span class="arabic" lang="ar" dir="rtl">حلال</span><span class="halal-word">HALAL</span></div>
  <h1 class="title" id="title" aria-label="MENUS FAMILLE"></h1>
  <section class="items" id="items"></section>
  <canvas id="smokeFront" class="smoke" width="1920" height="1080"></canvas>
</main>

<script>
// ---- EDIT YOUR MENU HERE ----
// PHOTOS: put transparent PNGs in the "images" folder (or change the paths below).
// LOGO: images/logo.png (square PNG)
const euro = n => n.toFixed(2).replace('.', ',') + ' \u20AC';
const TITLE = 'MENUS FAMILLE';
const ITEMS = [
  { num: 35, img: 'images/famille-35.png', price: 27.00, lines: ['25 AILES DE POULET', '\u00C9PIC\u00C9ES'] },
  { num: 36, img: 'images/famille-36.png', price: 27.00, lines: ['6 MORCEAUX DE POULET', '+', '12 AILES DE POULET \u00C9PIC\u00C9ES'] },
  { num: 37, img: 'images/famille-37.png', price: 27.00, lines: ['10 MORCEAUX', 'DE POULET'] },
  { num: 38, img: 'images/famille-38.png', price: 33.00, lines: ['20 AILES DE POULET \u00C9PIC\u00C9ES', '+', '10 FILETS DE POULET (TENDERS)'] },
  { num: 39, img: 'images/famille-39.png', price: 30.00, lines: ['20 FILETS DE POULET', '(TENDERS)'] }
];
// -----------------------------

const title = document.getElementById('title');
[...TITLE].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch === ' ' ? '\u00A0' : ch;
  s.style.animationDelay = (0.15 + i * 0.16) + 's';
  title.appendChild(s);
});

const items = document.getElementById('items');
ITEMS.forEach((it, i) => {
  const c = document.createElement('div');
  c.className = 'col';
  c.style.animationDelay = (0.7 + i * 0.12) + 's';
  const name = it.lines.map(l => l === '+' ? '<small>+</small>' : l).join('<br>').replace(/<br><small>\+<\/small><br>/g, '<small>+</small>');
  c.innerHTML =
    '<div class="pbox"><img src="' + it.img + '" alt="" onerror="this.style.display=\'none\'">' +
      '<div class="num"><div class="nb">' + it.num + '</div></div></div>' +
    '<div class="nm">' + name + '</div>' +
    '<div class="pricebar"><div class="lb">MENU</div><div class="pr">' + euro(it.price) + '</div></div>';
  items.appendChild(c);
});

// fit the title inside the frame, clear of the logos
function fitTitle() {
  title.style.fontSize = '250px';
  const max = 1780, w = title.scrollWidth;
  if (w > max) title.style.fontSize = Math.floor(250 * max / w) + 'px';
}
fitTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

// ---- smoke (deterministic: picture is a pure function of time) ----
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7), LIFE = [8, 8, 4];
const mk = (n, f) => Array.from({ length: n }, (_, i) => f(i));
const backSmoke = mk(46, i => ({ x: R()*2100-100, y: 1200+R()*100, rise: 900+R()*500, r0: 140+R()*120, r1: 200+R()*200, amp: 50+R()*110, fr: 1+Math.floor(R()*2), ph: R()*6.28, dr: -200+R()*400, off: R()*8, L: LIFE[i%3], a: .26+R()*.16, c: i%4===0 ? '124,45,18' : '255,255,255' }));
const steam = mk(26, i => ({ x: 1180+R()*600, y: 480+R()*60, rise: 420+R()*220, r0: 40+R()*40, r1: 90+R()*70, amp: 30+R()*50, fr: 1+Math.floor(R()*2), ph: R()*6.28, dr: -120+R()*100, off: R()*8, L: LIFE[i%3], a: .30+R()*.14, c: '255,247,237' }));
const wisps = mk(14, i => ({ x: R()*2000, y: 1150, rise: 1000+R()*300, r0: 260+R()*120, r1: 260+R()*150, amp: 120+R()*120, fr: 1, ph: R()*6.28, dr: -300+R()*600, off: R()*8, L: 8, a: .16+R()*.08, c: '255,255,255' }));

function drawSmoke(ctx, arr, t) {
  ctx.clearRect(0, 0, 1920, 1080);
  for (const p of arr) {
    const u = ((t / 1000 + p.off) % p.L) / p.L;
    const x = p.x + Math.sin(u * 6.283 * p.fr + p.ph) * p.amp + u * p.dr;
    const y = p.y - u * p.rise, r = p.r0 + u * p.r1;
    const al = p.a * Math.pow(Math.sin(Math.PI * u), 1.4);
    if (al < .004) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + p.c + ',' + al + ')');
    g.addColorStop(.55, 'rgba(' + p.c + ',' + (al * .45) + ')');
    g.addColorStop(1, 'rgba(' + p.c + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
}
const bctx = document.getElementById('smokeBack').getContext('2d');
const fctx = document.getElementById('smokeFront').getContext('2d');
function setTime(t) { drawSmoke(bctx, backSmoke, t); drawSmoke(fctx, wisps.concat(steam), t); }
window.__setTime = setTime;
if (window.__manual) setTime(0);
else if (matchMedia('(prefers-reduced-motion: reduce)').matches) setTime(3000);
else { const t0 = performance.now(); (function loop(n) { setTime(n - t0); requestAnimationFrame(loop); })(t0); }

// ---- fit 1920x1080 stage to any screen ----
function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + k + ')';
}
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
