:root {
  --orange-600: #ea580c;
  --orange-700: #c2410c;
  --orange-900: #7c2d12;
  --cream: #fff7ed;
  --ink: #1c1917;
  --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #14110f; overflow: hidden; }
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; background: var(--orange-600); overflow: hidden; font-family: var(--body); color: #fff; }

/* background: endless outlined type */
.bg { position: absolute; left: 0; white-space: nowrap; font-family: var(--display); font-size: 330px; line-height: 1; color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.12); animation: slide 60s linear infinite; }
.bg.b1 { top: -40px; }
.bg.b2 { top: 660px; animation-direction: reverse; }
@keyframes slide { to { transform: translateX(-50%); } }

.smoke { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
#smokeBack { z-index: 1; }
#smokeFront { z-index: 6; }
.logo { position: absolute; left: 72px; top: 14px; width: 92px; height: 92px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 5; }
.logo img { width: 68px; height: 68px; object-fit: contain; }

/* headline, letter by letter */
.title { position: absolute; margin: 0; left: 60px; top: 120px; display: flex; font-family: var(--display); font-size: 430px; line-height: .9; letter-spacing: 0; color: #fff; text-shadow: 10px 12px 0 var(--orange-900); z-index: 2; }
.title span { display: inline-block; opacity: 0; animation: smokeIn 1.5s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes smokeIn { from { opacity: 0; filter: blur(46px); transform: translateY(70px) scale(1.18); } 60% { opacity: .9; } to { opacity: 1; filter: blur(0); transform: none; } }

.hero { position: absolute; left: 1170px; top: 60px; width: 720px; z-index: 3; transform: rotate(8deg); filter: drop-shadow(0 30px 24px rgba(124,45,18,.55)); animation: heroIn 1.4s ease .6s both, bob 4s ease-in-out 2s infinite; }
@keyframes heroIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fog { from { opacity: 0; filter: blur(50px) drop-shadow(0 30px 24px rgba(124,45,18,.55)); } to { opacity: 1; filter: blur(0) drop-shadow(0 30px 24px rgba(124,45,18,.55)); } }
@keyframes bob { 50% { transform: rotate(5deg) translateY(-16px); } }

.size { position: absolute; width: 210px; height: 210px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 4; opacity: 0; animation: pop .6s cubic-bezier(.3,1.6,.5,1) forwards; }
.size .lb { font-size: 28px; font-weight: 800; letter-spacing: 5px; }
.size .pr { font-family: var(--display); font-size: 62px; line-height: 1.1; }
.size.s1 { left: 1120px; top: 360px; background: var(--cream); color: var(--orange-600); --r: -10deg; animation-delay: 1.1s; }
.size.s1 .lb { color: var(--ink); }
.size.s2 { left: 1690px; top: 390px; background: var(--ink); color: #fff; --r: 8deg; animation-delay: 1.25s; }
@keyframes pop { from { opacity: 0; transform: scale(.3) rotate(0deg); } to { opacity: 1; transform: scale(1) rotate(var(--r)); } }

/* items */
.items { position: absolute; left: 72px; right: 72px; top: 600px; display: flex; gap: 0; z-index: 4; }
.col { flex: 1; opacity: 0; filter: blur(20px); transform: translateY(50px); animation: up 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes up { to { opacity: 1; filter: blur(0); transform: none; } }
.pbox { position: relative; height: 210px; display: flex; align-items: center; justify-content: center; }
.pbox img { max-width: 290px; max-height: 210px; object-fit: contain; filter: drop-shadow(0 14px 10px rgba(124,45,18,.45)); }
.tag { position: absolute; right: 8px; top: -14px; width: 136px; height: 136px; border-radius: 50%; background: var(--cream); color: var(--orange-600); font-family: var(--display); font-size: 42px; display: flex; align-items: center; justify-content: center; transform: rotate(9deg); box-shadow: 0 8px 0 rgba(124,45,18,.35); }
.nm { font-family: var(--display); font-size: 64px; line-height: 1; letter-spacing: 1px; margin-top: 20px; }
.sub { font-size: 30px; font-weight: 800; letter-spacing: 4px; color: var(--ink); margin-top: 8px; }


/* smoke */
.smoke { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.smoke.back { z-index: 1; }
.smoke.front { z-index: 6; }
.wisp { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, var(--c), rgba(255,255,255,0)); filter: blur(24px); opacity: 0; will-change: transform, opacity; animation: rise var(--d) linear infinite; animation-delay: var(--dl); }
@keyframes rise {
  0%   { opacity: 0; transform: translate(0, 0) rotate(var(--rot)) scale(.5, .4); }
  18%  { opacity: var(--o); }
  70%  { opacity: calc(var(--o) * .55); }
  100% { opacity: 0; transform: translate(var(--dx), -760px) rotate(calc(var(--rot) + 50deg)) scale(1.9, 2.3); }
}

@media (prefers-reduced-motion: reduce) { .smoke { display: none; } .bg, .hero, .size, .col, .title span { animation: none !important; opacity: 1 !important; filter: none !important; transform: none; } .size.s1 { transform: rotate(-10deg); } .size.s2 { transform: rotate(8deg); } .hero { transform: rotate(8deg); } }
</style>
</head>
<body>
<main id="stage" aria-label="Menu Frites">
    <canvas id="smokeBack" class="smoke" width="1920" height="1080"></canvas>
  <div class="smoke back" id="smokeB"></div>
  <div class="logo"><img src="images/logo.png" alt="Logo"></div>
  <h1 class="title" id="title" aria-label="FRITES"></h1>
  <img class="hero" src="images/fries.png" alt="Frites">
  <div id="sizes"></div>
  <section class="items" id="items"></section>
  <div class="smoke front" id="smokeF"></div>
  <canvas id="smokeFront" class="smoke" width="1920" height="1080"></canvas>
</main>

<script>
// ---- EDIT YOUR MENU HERE ----
// PHOTOS: replace the files in the "images" folder (keep the same names, use transparent PNGs),
// or change the paths in ITEMS below. LOGO: replace images/logo.png (square PNG).
// FRIES photo (big, top right): images/fries.png
const euro = n => n.toFixed(2).replace('.', ',') + ' \u20AC';
const TITLE = 'FRITES';
const SIZES = [
  { label: 'PETITE', price: 1.50 },
  { label: 'GRANDE', price: 3.00 }
];
const ITEMS = [
  { name: 'POTATO<br>WEDGE',        price: 4.00, img: 'images/potato-wedge.png' },
  { name: 'FRITES<br>SPIRALES',     price: 4.00, img: 'images/frites-spirales.png' },
  { name: 'ONION<br>RINGS',         price: 4.00, img: 'images/onion-rings.png' },
  { name: 'MOZZA<br>STICK',         price: 4.00, img: 'images/mozza-stick.png' },
  { name: 'RED HOT<br>JALAPE\u00D1OS', sub: '6 PI\u00C8CES', price: 6.00, img: 'images/jalapenos.png' }
];
// -----------------------------


const title = document.getElementById('title');
[...TITLE].forEach((ch, i) => {
  const s = document.createElement('span');
  s.textContent = ch;
  s.style.animationDelay = (0.15 + i * 0.16) + 's';
  title.appendChild(s);
});

const sizes = document.getElementById('sizes');
SIZES.forEach((s, i) => {
  const d = document.createElement('div');
  d.className = 'size s' + (i + 1);
  d.innerHTML = '<div class="lb">' + s.label + '</div><div class="pr">' + euro(s.price) + '</div>';
  sizes.appendChild(d);
});

const items = document.getElementById('items');
ITEMS.forEach((it, i) => {
  const c = document.createElement('div');
  c.className = 'col';
  c.style.animationDelay = (0.7 + i * 0.12) + 's';
  c.style.marginTop = (i % 2 ? 34 : 0) + 'px';
  c.innerHTML = '<div class="pbox"><img src="' + it.img + '" alt=""><div class="tag">' + euro(it.price) + '</div></div>' +
    '<div class="nm">' + it.name + '</div>' + (it.sub ? '<div class="sub">' + it.sub + '</div>' : '');
  items.appendChild(c);
});

// ---- smoke (deterministic: the picture is a pure function of time) ----
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R = rng(7), LIFE = [8, 8, 4];
const mk = (n, f) => Array.from({ length: n }, (_, i) => f(i));
const backSmoke = mk(46, i => ({ x: R()*2100-100, y: 1200+R()*100, rise: 900+R()*500, r0: 140+R()*120, r1: 200+R()*200, amp: 50+R()*110, fr: 1+Math.floor(R()*2), ph: R()*6.28, dr: -200+R()*400, off: R()*8, L: LIFE[i%3], a: .10+R()*.08, c: i%4===0 ? '124,45,18' : '255,255,255' }));
const steam = mk(26, i => ({ x: 1180+R()*600, y: 480+R()*60, rise: 420+R()*220, r0: 40+R()*40, r1: 90+R()*70, amp: 30+R()*50, fr: 1+Math.floor(R()*2), ph: R()*6.28, dr: -120+R()*100, off: R()*8, L: LIFE[i%3], a: .22+R()*.12, c: '255,247,237' }));
const wisps = mk(14, i => ({ x: R()*2000, y: 1150, rise: 1000+R()*300, r0: 260+R()*120, r1: 260+R()*150, amp: 120+R()*120, fr: 1, ph: R()*6.28, dr: -300+R()*600, off: R()*8, L: 8, a: .07+R()*.04, c: '255,255,255' }));
function drawSmoke(ctx, arr, t) {
  ctx.clearRect(0, 0, 1920, 1080);
  for (const p of arr) {
    const u = ((t/1000 + p.off) % p.L) / p.L;
    const x = p.x + Math.sin(u*6.283*p.fr + p.ph)*p.amp + u*p.dr;
    const y = p.y - u*p.rise, r = p.r0 + u*p.r1;
    const al = p.a * Math.pow(Math.sin(Math.PI*u), 1.4);
    if (al < .004) continue;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + p.c + ',' + al + ')');
    g.addColorStop(.55, 'rgba(' + p.c + ',' + (al*.45) + ')');
    g.addColorStop(1, 'rgba(' + p.c + ',0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  }
}
const bctx = document.getElementById('smokeBack').getContext('2d');
const fctx = document.getElementById('smokeFront').getContext('2d');
function setTime(t) { drawSmoke(bctx, backSmoke, t); drawSmoke(fctx, wisps.concat(steam), t); }
window.__setTime = setTime;
if (window.__manual) setTime(0);
else if (matchMedia('(prefers-reduced-motion: reduce)').matches) setTime(3000);
else { const t0 = performance.now(); (function loop(n) { setTime(n - t0); requestAnimationFrame(loop); })(t0); }

// ---- smoke ----
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function makeSmoke(el, n, seed, o) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const w = o.w[0] + r() * (o.w[1] - o.w[0]);
    const d = 7 + r() * 5;
    const w$ = document.createElement('div');
    w$.className = 'wisp';
    w$.style.cssText =
      'width:' + w + 'px;height:' + (w * 0.7) + 'px;' +
      'left:' + (o.x[0] + r() * (o.x[1] - o.x[0]) - w / 2) + 'px;' +
      'top:' + (o.y[0] + r() * (o.y[1] - o.y[0])) + 'px;' +
      '--c:' + (r() < o.dark ? 'rgba(124,45,18,.55)' : 'rgba(255,244,230,.75)') + ';' +
      '--o:' + (o.o[0] + r() * (o.o[1] - o.o[0])).toFixed(2) + ';' +
      '--rot:' + Math.round(r() * 120 - 60) + 'deg;' +
      '--dx:' + Math.round(r() * 360 - 180) + 'px;' +
      '--d:' + d.toFixed(1) + 's;' +
      '--dl:-' + (r() * d).toFixed(1) + 's;';
    el.appendChild(w$);
  }
}
makeSmoke(document.getElementById('smokeB'), 18, 7,  { w: [320, 560], x: [0, 1920],    y: [560, 1060], o: [0.35, 0.6],  dark: 0.3 });
makeSmoke(document.getElementById('smokeF'), 12, 21, { w: [240, 420], x: [1050, 1850], y: [380, 700],  o: [0.2, 0.34], dark: 0.15 });

function fit() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + k + ')';
}
addEventListener('resize', fit);
fit();
</script>
</body>
</html>
